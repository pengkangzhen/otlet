[project]
name = "agent-lit"
version = "0.1.0"
description = "Agent-based literature management software"
authors = [
    {name = "pengkangzhen", email = "pengkangzhen@outlook.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
    "rich>=13.0,<14",
    "pymupdf>=1.24,<2",
    "litellm>=1.40,<2",
    "httpx>=0.27,<1",
    "pywebview>=6.2.1,<7.0.0",
]

[project.scripts]
agent-lit = "agent_lit.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "ruff>=0.15.16,<0.16",
    "pytest-cov>=7.1.0,<8",
    "pyinstaller>=6.20,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_lit"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
